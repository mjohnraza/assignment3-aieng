[project]
name = "wandering-kettle-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "mcp[cli]>=2.3.0",
    "ollama>=0.6.3",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
wandering-kettle-assistant = "wandering_kettle_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
