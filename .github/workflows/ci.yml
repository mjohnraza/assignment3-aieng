name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Automated Test Suite & Integration Verification
    runs-on: ubuntu-latest
    env:
      CI: "true"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen || uv sync

      - name: Pre-download embedding model for tests
        run: |
          uv run python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-small')"

      - name: Execute pytest test suite
        run: |
          uv run pytest -v

